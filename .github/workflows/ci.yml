name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 本插件不需要构建，也不需要安装依赖即可跑语法检查与单测：
      # 单测只依赖 node 内置模块；index.js 的 @deepseek-ai/schemastery 仅做语法检查。
      - name: Syntax check
        run: |
          set -euo pipefail
          for f in index.js config.js chat-file.js waker.js deploy.js heartbeat.js mcp.js lib/client.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Unit tests
        run: |
          set -euo pipefail
          node test/config.test.js
          node test/chat-file.test.js
          node test/waker.test.js
          node test/heartbeat.test.js
          node test/security.test.js

      - name: Package contents (files whitelist)
        run: npm pack --dry-run

  tag-version:
    name: Tag matches package.json version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag and version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG_VERSION tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
